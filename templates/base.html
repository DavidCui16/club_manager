<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 56px; }
        .sidebar { position: fixed; top: 56px; bottom: 0; left: 0; width: 200px; background: #f8f9fa; border-right: 1px solid #dee2e6; }
        .sidebar .nav-link { color: #333; padding: 10px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #0d6efd; color: white; }
        .main-content { margin-left: 200px; padding: 20px; }
        .stat-card { border-radius: 10px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-people-fill"></i> 社团管理系统</span>
            <div>
                <span class="text-white me-3">已登录</span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">退出</a>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <nav class="nav flex-column mt-2">
            <a class="nav-link {{ 'active' if request.path == '/' }}" href="{{ url_for('index') }}">
                <i class="bi bi-speedometer2"></i> 首页
            </a>
            <a class="nav-link {{ 'active' if request.path == '/members' }}" href="{{ url_for('members') }}">
                <i class="bi bi-people"></i> 成员管理
            </a>
            <a class="nav-link {{ 'active' if request.path == '/events' }}" href="{{ url_for('events') }}">
                <i class="bi bi-calendar-event"></i> 活动管理
            </a>
            <a class="nav-link {{ 'active' if request.path == '/finances' }}" href="{{ url_for('finances') }}">
                <i class="bi bi-wallet2"></i> 财务管理
            </a>
        </nav>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
