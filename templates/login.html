<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 社团管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 380px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card shadow login-card">
        <div class="card-body p-4">
            <h4 class="text-center mb-4">社团管理系统</h4>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">管理密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入管理密码" required autofocus>
                </div>
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
        </div>
    </div>
</body>
</html>
