<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding-top: 56px; background: #f5f6fa; }
        .sidebar { position: fixed; top: 56px; bottom: 0; left: 0; width: 200px; background: #2c3e50; }
        .sidebar .nav-link { color: #bdc3c7; padding: 12px 20px; border-radius: 0; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #34495e; color: white; }
        .main-content { margin-left: 200px; padding: 25px; }
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .table { background: white; border-radius: 8px; overflow: hidden; }
        .login-container { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
        .login-card { width: 400px; border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-people-fill"></i> 社团管理系统</span>
            <div id="userArea"></div>
        </div>
    </nav>

    <!-- 登录页 -->
    <div id="loginPage" class="login-container">
        <div class="card login-card">
            <div class="card-body p-5 text-center">
                <i class="bi bi-people-fill display-1 text-primary"></i>
                <h3 class="mt-3 mb-4">社团管理系统</h3>
                <div class="mb-3">
                    <label class="form-label text-start w-100 fw-bold">Supabase URL</label>
                    <input id="supabaseUrl" class="form-control" placeholder="https://xxxxx.supabase.co">
                </div>
                <div class="mb-3">
                    <label class="form-label text-start w-100 fw-bold">Anon Key</label>
                    <input id="supabaseKey" class="form-control" placeholder="eyJhbGciO...">
                </div>
                <div class="mb-3">
                    <label class="form-label text-start w-100 fw-bold">管理密码</label>
                    <input id="loginPassword" class="form-control" type="password" placeholder="输入管理密码">
                </div>
                <button class="btn btn-primary w-100 btn-lg" onclick="doLogin()">登录</button>
                <div class="mt-3 text-muted small">
                    首次使用请在 Supabase SQL Editor 中运行 schema.sql
                </div>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainPage" style="display:none">
        <div class="sidebar">
            <nav class="nav flex-column mt-2">
                <a class="nav-link active" href="#" data-page="dashboard"><i class="bi bi-speedometer2 me-2"></i>首页</a>
                <a class="nav-link" href="#" data-page="members"><i class="bi bi-people me-2"></i>成员管理</a>
                <a class="nav-link" href="#" data-page="events"><i class="bi bi-calendar-event me-2"></i>活动管理</a>
                <a class="nav-link" href="#" data-page="finances"><i class="bi bi-wallet2 me-2"></i>财务管理</a>
                <a class="nav-link" href="#" data-page="settings"><i class="bi bi-gear me-2"></i>系统设置</a>
            </nav>
        </div>
        <div class="main-content">
            <div id="dashboardPage"></div>
            <div id="membersPage" style="display:none"></div>
            <div id="eventsPage" style="display:none"></div>
            <div id="financesPage" style="display:none"></div>
            <div id="settingsPage" style="display:none"></div>
        </div>
    </div>

    <!-- 通用 Modal -->
    <div class="modal fade" id="genericModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content" id="genericModalContent"></div></div>
    </div>

<script>
let supabase;
const SUPABASE_URL_KEY = 'club_mgr_supabase_url';
const SUPABASE_KEY_KEY = 'club_mgr_supabase_key';
const AUTH_KEY = 'club_mgr_auth';

document.getElementById('supabaseUrl').value = localStorage.getItem(SUPABASE_URL_KEY) || '';
document.getElementById('supabaseKey').value = localStorage.getItem(SUPABASE_KEY_KEY) || '';

if (localStorage.getItem(AUTH_KEY) === 'true' && localStorage.getItem(SUPABASE_URL_KEY)) {
    initSupabase();
    checkSession();
}

function initSupabase() {
    const url = document.getElementById('supabaseUrl').value || localStorage.getItem(SUPABASE_URL_KEY);
    const key = document.getElementById('supabaseKey').value || localStorage.getItem(SUPABASE_KEY_KEY);
    supabase = window.supabase.createClient(url, key);
}

async function doLogin() {
    const url = document.getElementById('supabaseUrl').value.trim();
    const key = document.getElementById('supabaseKey').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!url || !key || !password) return alert('请填写所有字段');

    localStorage.setItem(SUPABASE_URL_KEY, url);
    localStorage.setItem(SUPABASE_KEY_KEY, key);
    initSupabase();

    const { data, error } = await supabase.from('settings').select('value').eq('key', 'password').single();
    if (error) return alert('连接失败: ' + error.message);
    if (data.value !== password) return alert('密码错误');

    localStorage.setItem(AUTH_KEY, 'true');
    showMain();
}

async function checkSession() {
    try {
        const { data, error } = await supabase.from('settings').select('value').eq('key', 'password').single();
        if (error) throw error;
        showMain();
    } catch { localStorage.removeItem(AUTH_KEY); }
}

function logout() {
    localStorage.removeItem(AUTH_KEY);
    location.reload();
}

function showMain() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    document.getElementById('userArea').innerHTML = '<button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>';
    loadDashboard();
    setupNav();
}

function setupNav() {
    document.querySelectorAll('.sidebar .nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
            this.classList.add('active');
            const page = this.dataset.page;
            ['dashboardPage','membersPage','eventsPage','financesPage','settingsPage'].forEach(p => {
                document.getElementById(p).style.display = p === page + 'Page' ? 'block' : 'none';
            });
            if (page === 'dashboard') loadDashboard();
            if (page === 'members') loadMembers();
            if (page === 'events') loadEvents();
            if (page === 'finances') loadFinances();
            if (page === 'settings') loadSettings();
        });
    });
}

// ==================== 首页 ====================
async function loadDashboard() {
    const [{ data: members }, { data: events }, { data: f_income }, { data: f_expense }] = await Promise.all([
        supabase.from('members').select('id', { count: 'exact', head: true }),
        supabase.from('events').select('id', { count: 'exact', head: true }),
        supabase.from('finances').select('amount').eq('type', 'income'),
        supabase.from('finances').select('amount').eq('type', 'expense'),
    ]);
    const totalIncome = (f_income || []).reduce((s, r) => s + parseFloat(r.amount), 0);
    const totalExpense = (f_expense || []).reduce((s, r) => s + parseFloat(r.amount), 0);
    const balance = totalIncome - totalExpense;
    const [mcount, ecount] = [members.length, events.length];

    document.getElementById('dashboardPage').innerHTML = `
        <h4 class="mb-4">首页概览</h4>
        <div class="row g-4">
            <div class="col-md-3"><div class="card stat-card text-bg-primary"><div class="card-body text-center py-4">
                <i class="bi bi-people display-5"></i><h5 class="mt-2">成员总数</h5><span class="display-5 fw-bold">${mcount}</span></div></div></div>
            <div class="col-md-3"><div class="card stat-card text-bg-success"><div class="card-body text-center py-4">
                <i class="bi bi-calendar-event display-5"></i><h5 class="mt-2">活动总数</h5><span class="display-5 fw-bold">${ecount}</span></div></div></div>
            <div class="col-md-3"><div class="card stat-card text-bg-info"><div class="card-body text-center py-4">
                <i class="bi bi-cash-coin display-5"></i><h5 class="mt-2">总收入</h5><span class="display-5 fw-bold">¥${totalIncome.toFixed(2)}</span></div></div></div>
            <div class="col-md-3"><div class="card stat-card text-bg-warning"><div class="card-body text-center py-4">
                <i class="bi bi-piggy-bank display-5"></i><h5 class="mt-2">当前结余</h5><span class="display-5 fw-bold">¥${balance.toFixed(2)}</span></div></div></div>
        </div>`;
}

// ==================== 成员管理 ====================
async function loadMembers(search) {
    let q = supabase.from('members').select('*').order('id', { ascending: false });
    if (search) q = q.or(`name.ilike.%${search}%,student_id.ilike.%${search}%,department.ilike.%${search}%`);
    const { data } = await q;
    const rows = (data || []).map(m => `
        <tr>
            <td>${m.id}</td><td>${he(m.name)}</td><td>${he(m.student_id)}</td><td>${he(m.phone)}</td>
            <td>${he(m.email)}</td><td>${he(m.department)}</td><td>${m.join_date}</td>
            <td><span class="badge ${m.status==='active'?'bg-success':'bg-secondary'}">${m.status==='active'?'活跃':'非活跃'}</span></td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="editMember('${m.id}')">编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteMember('${m.id}','${he(m.name)}')">删除</button>
            </td>
        </tr>`).join('');

    document.getElementById('membersPage').innerHTML = `
        <h4 class="mb-3">成员管理</h4>
        <div class="d-flex justify-content-between mb-3">
            <div class="input-group" style="max-width:350px;">
                <input id="memberSearch" class="form-control" placeholder="搜索姓名/学号/院系..." value="${search||''}">
                <button class="btn btn-outline-secondary" onclick="loadMembers(document.getElementById('memberSearch').value)">搜索</button>
                <button class="btn btn-outline-secondary" onclick="document.getElementById('memberSearch').value='';loadMembers()">全部</button>
            </div>
            <button class="btn btn-primary" onclick="showMemberForm()">+ 添加成员</button>
        </div>
        <table class="table table-hover"><thead class="table-light">
            <tr><th>ID</th><th>姓名</th><th>学号</th><th>电话</th><th>邮箱</th><th>院系</th><th>加入日期</th><th>状态</th><th>操作</th></tr>
        </thead><tbody>${rows||'<tr><td colspan="9" class="text-center text-muted">暂无数据</td></tr>'}</tbody></table>`;
}

function showMemberForm(id) {
    const isEdit = !!id;
    const title = isEdit ? '编辑成员' : '添加成员';
    let body = `<input type="hidden" id="editMemberId" value="${id||''}">
        <div class="mb-2"><label class="form-label">姓名 *</label><input id="fmName" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">学号</label><input id="fmSid" class="form-control"></div>
        <div class="mb-2"><label class="form-label">电话</label><input id="fmPhone" class="form-control"></div>
        <div class="mb-2"><label class="form-label">邮箱</label><input id="fmEmail" class="form-control"></div>
        <div class="mb-2"><label class="form-label">院系</label><input id="fmDept" class="form-control"></div>
        <div class="mb-2"><label class="form-label">备注</label><input id="fmNotes" class="form-control"></div>`;

    showModal(title, body, async () => {
        const name = document.getElementById('fmName').value.trim();
        if (!name) return alert('姓名不能为空');
        const rec = {
            name, student_id: document.getElementById('fmSid').value, phone: document.getElementById('fmPhone').value,
            email: document.getElementById('fmEmail').value, department: document.getElementById('fmDept').value,
            notes: document.getElementById('fmNotes').value
        };
        if (isEdit) {
            await supabase.from('members').update(rec).eq('id', id);
        } else {
            await supabase.from('members').insert(rec);
        }
        hideModal();
        loadMembers();
    });

    if (isEdit) {
        supabase.from('members').select('*').eq('id', id).single().then(({ data }) => {
            if (data) {
                document.getElementById('fmName').value = data.name||'';
                document.getElementById('fmSid').value = data.student_id||'';
                document.getElementById('fmPhone').value = data.phone||'';
                document.getElementById('fmEmail').value = data.email||'';
                document.getElementById('fmDept').value = data.department||'';
                document.getElementById('fmNotes').value = data.notes||'';
            }
        });
    }
}

async function editMember(id) { showMemberForm(id); }
async function deleteMember(id, name) {
    if (!confirm(`确定删除成员「${name}」吗？`)) return;
    await supabase.from('members').delete().eq('id', id);
    loadMembers();
}

// ==================== 活动管理 ====================
async function loadEvents(search) {
    let q = supabase.from('events').select('*, event_participants(count)').order('event_date', { ascending: false });
    if (search) q = q.or(`name.ilike.%${search}%,location.ilike.%${search}%`);
    const { data } = await q;
    const statusMap = { upcoming: '即将开始', ongoing: '进行中', finished: '已结束', cancelled: '已取消' };
    const colorMap = { upcoming: 'bg-info', ongoing: 'bg-success', finished: 'bg-secondary', cancelled: 'bg-danger' };
    const rows = (data || []).map(e => `
        <tr>
            <td>${e.id}</td><td>${he(e.name)}</td><td>${e.event_date}</td><td>${he(e.location)}</td>
            <td>${e.event_participants[0]?.count||0}/${e.max_participants||'∞'}</td>
            <td>${e.fee}</td><td><span class="badge ${colorMap[e.status]||''}">${statusMap[e.status]||e.status}</span></td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="manageParticipants('${e.id}','${he(e.name)}')">报名</button>
                <button class="btn btn-sm btn-outline-secondary me-1" onclick="showEventForm('${e.id}')">编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteEvent('${e.id}','${he(e.name)}')">删除</button>
            </td>
        </tr>`).join('');

    document.getElementById('eventsPage').innerHTML = `
        <h4 class="mb-3">活动管理</h4>
        <div class="d-flex justify-content-between mb-3">
            <div class="input-group" style="max-width:350px;">
                <input id="eventSearch" class="form-control" placeholder="搜索活动..." value="${search||''}">
                <button class="btn btn-outline-secondary" onclick="loadEvents(document.getElementById('eventSearch').value)">搜索</button>
                <button class="btn btn-outline-secondary" onclick="document.getElementById('eventSearch').value='';loadEvents()">全部</button>
            </div>
            <button class="btn btn-primary" onclick="showEventForm()">+ 添加活动</button>
        </div>
        <table class="table table-hover"><thead class="table-light">
            <tr><th>ID</th><th>活动名称</th><th>日期</th><th>地点</th><th>已报名/上限</th><th>费用(元)</th><th>状态</th><th>操作</th></tr>
        </thead><tbody>${rows||'<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>'}</tbody></table>`;
}

function showEventForm(id) {
    const isEdit = !!id;
    let body = `<input type="hidden" id="editEventId" value="${id||''}">
        <div class="mb-2"><label>活动名称 *</label><input id="feName" class="form-control"></div>
        <div class="mb-2"><label>日期</label><input id="feDate" class="form-control" type="date"></div>
        <div class="mb-2"><label>地点</label><input id="feLocation" class="form-control"></div>
        <div class="mb-2"><label>人数上限 (0=不限)</label><input id="feMax" class="form-control" type="number" value="0"></div>
        <div class="mb-2"><label>费用(元)</label><input id="feFee" class="form-control" type="number" step="0.01" value="0"></div>
        <div class="mb-2"><label>描述</label><input id="feDesc" class="form-control"></div>
        ${isEdit ? '<div class="mb-2"><label>状态</label><select id="feStatus" class="form-select"><option value="upcoming">即将开始</option><option value="ongoing">进行中</option><option value="finished">已结束</option><option value="cancelled">已取消</option></select></div>' : ''}`;

    showModal(isEdit ? '编辑活动' : '添加活动', body, async () => {
        const name = document.getElementById('feName').value.trim();
        if (!name) return alert('活动名称不能为空');
        const rec = {
            name, event_date: document.getElementById('feDate').value,
            location: document.getElementById('feLocation').value,
            max_participants: parseInt(document.getElementById('feMax').value)||0,
            fee: parseFloat(document.getElementById('feFee').value)||0,
            description: document.getElementById('feDesc').value,
        };
        if (isEdit) {
            rec.status = document.getElementById('feStatus').value;
            await supabase.from('events').update(rec).eq('id', id);
        } else {
            await supabase.from('events').insert(rec);
        }
        hideModal();
        loadEvents();
    });

    if (isEdit) {
        supabase.from('events').select('*').eq('id', id).single().then(({ data }) => {
            if (data) {
                document.getElementById('feName').value = data.name||'';
                document.getElementById('feDate').value = data.event_date||'';
                document.getElementById('feLocation').value = data.location||'';
                document.getElementById('feMax').value = data.max_participants||0;
                document.getElementById('feFee').value = data.fee||0;
                document.getElementById('feDesc').value = data.description||'';
                document.getElementById('feStatus').value = data.status||'upcoming';
            }
        });
    }
}

async function deleteEvent(id, name) {
    if (!confirm(`确定删除活动「${name}」吗？`)) return;
    await supabase.from('events').delete().eq('id', id);
    loadEvents();
}

async function manageParticipants(eventId, eventName) {
    const [{ data: members }, { data: participants }] = await Promise.all([
        supabase.from('members').select('id,name,student_id').eq('status', 'active').order('name'),
        supabase.from('event_participants').select('member_id, members(id,name,student_id,department,phone)').eq('event_id', eventId)
    ]);

    const pids = new Set((participants||[]).map(p => p.member_id));
    let body = `<input type="hidden" id="pidEventId" value="${eventId}">
        <h5>${he(eventName)} - 报名管理</h5>
        <div class="d-flex gap-2 mb-3">
            <select id="pidSelect" class="form-select"><option value="">选择成员...</option>
                ${(members||[]).filter(m => !pids.has(m.id)).map(m => `<option value="${m.id}">${he(m.name)} (${he(m.student_id)})</option>`).join('')}
            </select>
            <button class="btn btn-success" onclick="addPidParticipant()">添加</button>
        </div>
        <table class="table table-sm"><thead><tr><th>ID</th><th>姓名</th><th>学号</th><th>院系</th><th>电话</th><th>操作</th></tr></thead>
        <tbody>${(participants||[]).map(p => `
            <tr><td>${p.members?.id}</td><td>${he(p.members?.name)}</td><td>${he(p.members?.student_id)}</td>
            <td>${he(p.members?.department)}</td><td>${he(p.members?.phone)}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="removePidParticipant(${eventId},${p.member_id})">取消</button></td></tr>
        `).join('')}</tbody></table>`;

    showModal('报名管理', body);
    window._pidRefresh = () => manageParticipants(eventId, eventName);
}
async function addPidParticipant() {
    const eventId = document.getElementById('pidEventId').value;
    const memberId = parseInt(document.getElementById('pidSelect').value);
    if (!memberId) return alert('请选择成员');
    await supabase.from('event_participants').insert({ event_id: parseInt(eventId), member_id: memberId });
    hideModal();
    loadEvents();
    if (window._pidRefresh) window._pidRefresh();
}
async function removePidParticipant(eventId, memberId) {
    await supabase.from('event_participants').delete().eq('event_id', eventId).eq('member_id', memberId);
    loadEvents();
    if (window._pidRefresh) window._pidRefresh();
}

// ==================== 财务管理 ====================
async function loadFinances() {
    const [{ data: finances }, { data: f_income }, { data: f_expense }] = await Promise.all([
        supabase.from('finances').select('*, members(name), events(name)').order('date', { ascending: false }).order('id', { ascending: false }),
        supabase.from('finances').select('amount').eq('type', 'income'),
        supabase.from('finances').select('amount').eq('type', 'expense'),
    ]);
    const income = (f_income||[]).reduce((s,r) => s + parseFloat(r.amount), 0);
    const expense = (f_expense||[]).reduce((s,r) => s + parseFloat(r.amount), 0);

    const rows = (finances||[]).map(f => `
        <tr>
            <td>${f.id}</td><td>${f.date}</td>
            <td><span class="badge ${f.type==='income'?'bg-success':'bg-danger'}">${f.type==='income'?'收入':'支出'}</span></td>
            <td>${parseFloat(f.amount).toFixed(2)}</td><td>${he(f.category)}</td>
            <td>${he(f.members?.name)}</td><td>${he(f.events?.name)}</td><td>${he(f.description)}</td>
            <td>
                <button class="btn btn-sm btn-outline-secondary me-1" onclick="showFinanceForm('${f.id}')">编辑</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteFinance('${f.id}')">删除</button>
            </td>
        </tr>`).join('');

    document.getElementById('financesPage').innerHTML = `
        <h4 class="mb-3">财务管理</h4>
        <div class="row g-3 mb-3">
            <div class="col-md-4"><div class="card stat-card text-bg-success"><div class="card-body text-center py-3"><h6>总收入</h6><h4>¥${income.toFixed(2)}</h4></div></div></div>
            <div class="col-md-4"><div class="card stat-card text-bg-danger"><div class="card-body text-center py-3"><h6>总支出</h6><h4>¥${expense.toFixed(2)}</h4></div></div></div>
            <div class="col-md-4"><div class="card stat-card text-bg-primary"><div class="card-body text-center py-3"><h6>结余</h6><h4>¥${(income-expense).toFixed(2)}</h4></div></div></div>
        </div>
        <div class="d-flex justify-content-end mb-3"><button class="btn btn-primary" onclick="showFinanceForm()">+ 添加记录</button></div>
        <table class="table table-hover"><thead class="table-light">
            <tr><th>ID</th><th>日期</th><th>类型</th><th>金额(元)</th><th>类别</th><th>关联成员</th><th>关联活动</th><th>描述</th><th>操作</th></tr>
        </thead><tbody>${rows||'<tr><td colspan="9" class="text-center text-muted">暂无数据</td></tr>'}</tbody></table>`;
}

async function showFinanceForm(id) {
    const [{ data: members }, { data: events }] = await Promise.all([
        supabase.from('members').select('id,name').eq('status','active').order('name'),
        supabase.from('events').select('id,name').order('name'),
    ]);
    const isEdit = !!id;
    let body = `<input type="hidden" id="editFinId" value="${id||''}">
        <div class="mb-2"><label>类型</label><select id="ffType" class="form-select"><option value="income">收入</option><option value="expense">支出</option></select></div>
        <div class="mb-2"><label>金额 *</label><input id="ffAmount" class="form-control" type="number" step="0.01"></div>
        <div class="mb-2"><label>类别</label><select id="ffCategory" class="form-select">
            <option value="会费">会费</option><option value="赞助">赞助</option><option value="活动收入">活动收入</option><option value="其他收入">其他收入</option>
            <option value="活动支出">活动支出</option><option value="物资采购">物资采购</option><option value="场地费">场地费</option><option value="其他支出">其他支出</option></select></div>
        <div class="mb-2"><label>关联成员</label><select id="ffMember" class="form-select"><option value="">无</option>${(members||[]).map(m => `<option value="${m.id}">${he(m.name)}</option>`).join('')}</select></div>
        <div class="mb-2"><label>关联活动</label><select id="ffEvent" class="form-select"><option value="">无</option>${(events||[]).map(e => `<option value="${e.id}">${he(e.name)}</option>`).join('')}</select></div>
        <div class="mb-2"><label>描述</label><input id="ffDesc" class="form-control"></div>`;

    showModal(isEdit ? '编辑财务记录' : '添加财务记录', body, async () => {
        const amount = parseFloat(document.getElementById('ffAmount').value);
        if (!amount || amount <= 0) return alert('金额必须大于0');
        const rec = {
            type: document.getElementById('ffType').value, amount,
            category: document.getElementById('ffCategory').value,
            member_id: document.getElementById('ffMember').value ? parseInt(document.getElementById('ffMember').value) : null,
            event_id: document.getElementById('ffEvent').value ? parseInt(document.getElementById('ffEvent').value) : null,
            description: document.getElementById('ffDesc').value,
        };
        if (isEdit) {
            await supabase.from('finances').update(rec).eq('id', parseInt(id));
        } else {
            await supabase.from('finances').insert(rec);
        }
        hideModal();
        loadFinances();
    });

    if (isEdit) {
        supabase.from('finances').select('*').eq('id', id).single().then(({ data }) => {
            if (data) {
                document.getElementById('ffType').value = data.type;
                document.getElementById('ffAmount').value = data.amount;
                document.getElementById('ffCategory').value = data.category||'';
                document.getElementById('ffMember').value = data.member_id||'';
                document.getElementById('ffEvent').value = data.event_id||'';
                document.getElementById('ffDesc').value = data.description||'';
            }
        });
    }
}
async function deleteFinance(id) {
    if (!confirm('确定删除该记录？')) return;
    await supabase.from('finances').delete().eq('id', id);
    loadFinances();
}

// ==================== 系统设置 ====================
async function loadSettings() {
    const { data } = await supabase.from('settings').select('value').eq('key', 'password').single();
    document.getElementById('settingsPage').innerHTML = `
        <h4 class="mb-4">系统设置</h4>
        <div class="card stat-card p-4" style="max-width:500px;">
            <div class="mb-3"><label class="form-label">管理密码</label>
                <input id="setPassword" class="form-control" type="text" value="${he(data?.value||'')}"></div>
            <button class="btn btn-primary" onclick="updatePassword()">保存密码</button>
            <hr class="my-4">
            <p class="text-muted small">把本页面部署到任意静态托管（如 Vercel、Netlify、GitHub Pages），多人打开同一个网址即可共享数据。</p>
        </div>`;
}

async function updatePassword() {
    const pw = document.getElementById('setPassword').value.trim();
    if (!pw) return alert('密码不能为空');
    await supabase.from('settings').upsert({ key: 'password', value: pw });
    alert('密码已更新');
}

// ==================== Modal 工具 ====================
function showModal(title, bodyHtml, onSave) {
    document.getElementById('genericModalContent').innerHTML = `
        <div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" id="modalSaveBtn">保存</button></div>`;
    document.getElementById('modalSaveBtn').onclick = onSave;
    new bootstrap.Modal('#genericModal').show();
}
function hideModal() { bootstrap.Modal.getInstance('#genericModal').hide(); }
function he(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
